<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조현재 | 행정학 · 금융·데이터 포트폴리오</title>
  <style>
    :root {
      --bg-cream: #f6f2e9;
      --bg-card: #fcfaf5;
      --bg-soft: #ebe4d5;
      --green-deep: #1b3b2b;
      --green-mid: #2f5d46;
      --green-sage: #7ea184;
      --green-mint: #dce6dc;
      --wood-warm: #c99e74;
      --text-main: #1d2621;
      --text-muted: #58635c;
      --border-line: #ded6c6;
      --shadow-soft: 0 14px 34px rgba(27, 59, 43, 0.08);
      --radius-lg: 22px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* 상단 안내 배너 */
    .top-banner {
      background-color: var(--green-deep);
      color: #f4f1ea;
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 8px 16px;
    }

    /* 헤더 및 내비게이션 (모바일 한 줄 최적화) */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: rgba(246, 242, 233, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-line);
    }

    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-mid), var(--green-sage));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      flex-shrink: 0;
    }

    .brand-text {
      display: block;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--green-deep);
      line-height: 1.2;
    }

    .brand-sub {
      display: block;
      font-size: 0.64rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .nav-links a {
      white-space: nowrap;
      padding: 4px 2px;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--green-deep);
      font-weight: 800;
    }

    .motion-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-line);
      background-color: var(--bg-card);
      color: var(--green-deep);
      font-size: 0.76rem;
      font-weight: 700;
      white-space: nowrap;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .motion-toggle:hover,
    .motion-toggle:focus-visible {
      background-color: var(--green-mint);
      border-color: var(--green-sage);
    }

    /* 공통 섹션 레이아웃 */
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    section {
      padding: 64px 0;
      border-bottom: 1px solid var(--border-line);
      scroll-margin-top: 72px;
    }

    section:last-of-type {
      border-bottom: none;
    }

    .section-eyebrow {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green-mid);
      margin-bottom: 8px;
    }

    .section-title {
      font-size: clamp(1.55rem, 3vw, 2.15rem);
      font-weight: 800;
      color: var(--green-deep);
      line-height: 1.28;
      margin-bottom: 12px;
    }

    .section-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 640px;
      margin-bottom: 32px;
    }

    /* 1. 소개(Hero) + 움직이는 작업실 */
    .hero {
      padding-top: 44px;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;
      gap: 40px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap
